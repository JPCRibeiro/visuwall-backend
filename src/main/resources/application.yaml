server:
  port: ${PORT:8080}

spring:
  application:
    name: visuwall-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visuwall}
    username: ${SPRING_DATASOURCE_USERNAME:visuwall}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  issuer: ${JWT_ISSUER:visuwall}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
  refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:PT10S}
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}

aws:
  s3:
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket-name: ${S3_BUCKET_NAME}
    public-url: ${S3_PUBLIC_URL}

logging:
  level:
    software.amazon.awssdk: WARN